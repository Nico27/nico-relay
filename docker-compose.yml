# Development stack: hot reload on both sides, one command to boot.
#
#   docker compose up --build
#   web  -> http://localhost:5180
#   api  -> http://localhost:8010/docs
#   db   -> localhost:55432
#
# Host ports are deliberately unusual: 5432/8000/5173 are commonly taken by other
# local stacks. Override them in .env if you need to.
name: relay

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay}
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@db:5432/${POSTGRES_DB:-relay}
      SEED_ON_START: ${SEED_ON_START:-1}
      SEED_PATH: /app/seed.sql
      BASELINE_WEEKS: ${BASELINE_WEEKS:-8}
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
      - ./seed.sql:/app/seed.sql:ro
    depends_on:
      db:
        condition: service_healthy

  # The dev web container runs as root because the `node` user cannot write the
  # bind-mounted node_modules volume. The API image (Dockerfile) runs as 10001.
  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_HOST_PORT:-5180}:5173"
    volumes:
      - ./frontend:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
